version: "2"
sql:
  - schema:
      - "./migrations"
      - "./internal/db/types.sql"
    queries: "./internal/db/queries/"
    engine: "postgresql"
    gen:
      go:
        package: "sqlc"
        out: "internal/db/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        overrides:
          - db_type: "uuid"
            go_type: "uuid.UUID"
          - db_type: "pg_catalog.int4"
            go_type: "int"
          - db_type: "jsonb"
            go_type: "encoding/json/jsontext.Value"