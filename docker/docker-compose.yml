services:
  kaizen_db:
    image: postgres:16-alpine
    container_name: kaizen_local_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_password123
      POSTGRES_DB: kaizen_dev
    ports:
      - "5432:5432"
    volumes:
      - kaizen_db_data:/var/lib/postgresql/data

  kaizen_test_db:
    image: postgres:16-alpine
    container_name: kaizen_test_db
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: kaizen_test
    ports:
      - "5433:5432"

  kaizen_redis:
    image: redis:8-alpine
    container_name: kaizen_redis
    ports:
      - "6379:6379"
    volumes:
      - kaizen_redis_data:/data
    command: redis-server --appendonly yes

  kaizen_test_redis:
    image: redis:8-alpine
    container_name: kaizen_test_redis
    ports:
      - "6380:6380"
    command: redis-server --appendonly yes
volumes:
  kaizen_db_data:
  kaizen_redis_data: